    "build", "-trimpath",
    "-ldflags=-s -w -H=windowsgui -X github.com/nsgo-dev/nsgo/core.appID=dev.goask.GoAsk",
    "-o", "go-ask.exe", ".",
]
env = { GOOS = "windows", GOARCH = "amd64", CGO_ENABLED = "0" }

